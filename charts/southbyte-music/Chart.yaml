apiVersion: v2
name: southbyte-music
description: MiniMax-Music3 als OpenAI-kompatibler Dienst, mit Weboberflaeche
type: application

# Beide Felder ueberschreibt die CI beim Veroeffentlichen; hier steht nur der
# Entwicklungsstand fuer 'helm template' aus dem Arbeitsverzeichnis.
#
# appVersion ist dabei nicht bloss Beschriftung: values.yaml laesst image.tag
# leer und faellt auf .Chart.AppVersion zurueck. Eine von Hand gepflegte Nummer
# zeigte deshalb auf ein Image, das es in der Registry nie gab. Die CI setzt
# stattdessen den sha-Tag des Laufes, der die Images gebaut hat, und prueft vor
# dem Ablegen nach, dass beide wirklich abholbar sind.
version: 0.1.0
appVersion: "main"

home: https://github.com/MvdB/southbyte-music
sources:
  - https://github.com/MvdB/southbyte-music
maintainers:
  - name: southbyte
    url: https://southbyte.de

keywords:
  - music-generation
  - text-to-music
  - minimax-music3
  - sglang
  - gpu

annotations:
  # Das Modell steht unter einer eigenen Lizenz, die mit ihm reist und nicht
  # mit diesem Chart. Wer das Chart installiert, laedt das Modell — deshalb
  # steht die Auflage hier, wo sie vor der Installation sichtbar ist.
  de.southbyte/model: MiniMaxAI/MiniMax-Music3
  de.southbyte/model-license: >-
    MiniMax-Music3 Community License. Kommerzielle Nutzung erlaubt, verlangt
    aber die sichtbare Nennung von "MiniMax-Music3" in der Oberflaeche des
    Produkts; ab 20 Mio. USD Jahresumsatz zusaetzlich eine schriftliche
    Genehmigung von MiniMax (api@minimax.io).
  de.southbyte/proof-of-concept: >-
    Kein Produkt. Ohne Zusicherung von Verfuegbarkeit, Eignung oder
    Ergebnisqualitaet, ohne Support und ohne Roadmap.
