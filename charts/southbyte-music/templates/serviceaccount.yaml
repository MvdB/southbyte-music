{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "southbyte-music.serviceAccountName" . }}
  labels:
    {{- include "southbyte-music.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Kein Pod hier spricht mit der Kubernetes-API. Das Token trotzdem
# einzuhaengen waere ein unnoetiger Angriffspunkt.
automountServiceAccountToken: false
{{- end }}
