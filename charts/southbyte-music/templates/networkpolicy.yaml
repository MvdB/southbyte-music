{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "southbyte-music.fullname" . }}
  labels:
    {{- include "southbyte-music.labels" . | nindent 4 }}
spec:
  # Gilt nur fuer den Musik-Server. Die Oberflaeche bleibt frei erreichbar,
  # sie ist der Weg hinein.
  podSelector:
    matchLabels:
      {{- include "southbyte-music.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "southbyte-music.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: webui
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
